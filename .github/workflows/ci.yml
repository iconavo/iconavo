name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Функция edge API собирается в один модуль без внешних импортов (ADR-0024).
      - run: pnpm api build
      # Скрипт тега для страниц без сборщика — тоже один модуль; его размер меряет pnpm size (ADR-0034).
      - run: pnpm icon build
      - run: pnpm test
      # Бюджеты размера (ADR-0034): size-limit — один раз, таблица — в журнале и в сводке запуска, и при
      # превышении тоже. Превышение роняет проверку, сломанная таблица — тоже.
      - name: Размер пакетов
        run: |
          set -o pipefail
          status=0
          pnpm exec size-limit --json > "$RUNNER_TEMP/size.json" || status=$?
          node - "$RUNNER_TEMP/size.json" <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const checks = JSON.parse(require("node:fs").readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(checks)) {
            console.error(checks.error ?? checks);
            process.exit(1);
          }
          const kb = (bytes) => `${(bytes / 1000).toFixed(2).replace(".", ",").replace("-", "−")} КБ`;
          const row = (c) =>
            c.sizeLimit === undefined
              ? `| \`${c.name}\` | — | — | — | нет файла |`
              : `| \`${c.name}\` | ${kb(c.size)} | ${kb(c.sizeLimit)} | ${kb(c.sizeLimit - c.size)} | ${c.passed ? "ок" : `**превышен на ${kb(c.size - c.sizeLimit)}**`} |`;
          console.log(
            [
              "### Размер пакетов (gzip, ADR-0034)",
              "",
              "| Пакет | Размер | Бюджет | Запас | Итог |",
              "| --- | ---: | ---: | ---: | --- |",
              ...checks.map(row),
              "",
              "Тег и React — сверх ядра, скрипт для страниц без сборщика — с ядром внутри. КБ — 1000 байт, как у size-limit.",
            ].join("\n"),
          );
          JS
          exit "$status"
