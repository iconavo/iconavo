name: Данные

# Пересобирает data/ из закреплённых источников и сверяет с тем, что лежит в git (ADR-0015):
# одинаковые источники должны давать побайтно одинаковые файлы — в том числе на Linux, когда data/
# собрана на Windows. Фильтр по путям задаётся только на весь файл, поэтому проверка отдельная.
# На PR проверка идёт всегда: она обязательна для слияния в main, а обязательная проверка, которая
# не запустилась, навсегда заблокировала бы PR — например, с одной документацией. В main — только
# когда менялись конвейер, источники или данные.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/pipeline/**"
      - "packages/schema/**"
      - "sources/**"
      - "sources.lock.json"
      - "data/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/data.yml"

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Скачанные наборы — по коду загрузчика, версиям из lock и конфигам (правила скачивания живут
      # в них: иначе кэш со старыми правилами качался бы заново при каждом запуске, но не сохранялся).
      # Точного кэша нет — берётся последний с тем же кодом загрузчика: загрузчик сам скачает заново
      # только наборы, у которых сменились версия или правила, а остальные не перекачиваются.
      # Сменился код загрузчика — старый кэш не берётся: файлы могли лечь по-другому.
      - uses: actions/cache@v6
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('packages/pipeline/src/sources/*.ts') }}-${{ hashFiles('sources.lock.json', 'sources/*.ts') }}
          restore-keys: sources-${{ hashFiles('packages/pipeline/src/sources/*.ts') }}-
      - run: pnpm sources fetch
      # В кэше остаются только версии из lock: иначе он растёт с каждым обновлением набора.
      - name: Старые версии наборов — из кэша
        run: |
          shopt -s nullglob
          for dir in .cache/sources/*/*/ .cache/sources/*/.tmp-*/; do
            dir=${dir%/}
            id=$(basename "$(dirname "$dir")")
            keep=$(jq -r --arg id "$id" '.[$id] | .version // .commit // empty' sources.lock.json)
            if [ "${dir##*/}" != "$keep" ]; then
              echo "удалено из кэша: $dir"
              rm -rf -- "$dir"
            fi
          done
      - run: pnpm data
      - name: data/ совпадает со сборкой
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "::error::Сборка на Linux дала не те файлы, что лежат в git. Запустите pnpm data и закоммитьте data/; если у вас файлы не меняются — ищите, что в сборке зависит от системы."
            exit 1
          fi
