name: Сайт

# Сайт iconavo.dev на Vercel (ADR-0050, шаг 10 фазы 3): главная и документация /docs, собранная из README.
# Три задачи. «Сборка» — без ключей: pnpm install, tsc, затем Vercel CLI `vercel build --prod` по
# настройкам проекта из этого файла (.vercel/project.json пишет шаг сборки, apps/site/vercel.json
# выключает выкладку Vercel из Git); готовая сборка — артефакт-архив: tar сохраняет символические ссылки
# функций Next.js. «Выкладка» — из окружения site (выкладывать из него можно только из main), без
# checkout и pnpm install: Vercel CLI точной версии — свежий из реестра, `vercel deploy --prebuilt
# --prod`; ключ VERCEL_TOKEN видит только он, а код зависимостей сайта с ключом не встречается.
# «Проверка» — pnpm site --live: iconavo.dev отвечает этой сборкой, noindex, заголовки, ссылки, переходы
# с www и с http. Выкладывает только «живой» запуск — из main, не «только показ», main не ушёл вперёд,
# и переменная репозитория SITE_DEPLOY — on (её включает владелец после разовой настройки, ADR-0050).
# Проект iconavo-site создаёт первая выкладка. Откат — откат PR: запуск от main выложит прежнюю сборку.
# Что сайт собирается и работает, на каждом PR проверяет CI (задача site); PR с правкой этого файла —
# только показ.
#
# Сброс по наборам (шаг 4 фазы 4, ADR-0039). Страницы с данными берут их из edge API и хранятся в кэше
# Vercel с метками: set-{набор} — страница набора и страницы его иконок, catalog — общие. После каждого
# «Поискового индекса» на main (он идёт после «Выкладки» — новые страницы сразу получают свежие описания и
# похожие) и вручную («только сброс», «сбросить все наборы»):
# - «Сверка с раздачей» — без ключей: пауза 2 минуты (edge API помнит версию индекса до 90 секунд), затем
#   pnpm site --refresh — отпечатки наборов на живых страницах против оглавления каталога раздачи. Индекс
#   запустила не «Выкладка», а правка кода поиска или ручной запуск — сбрасываются все наборы: описания и
#   похожие могли измениться без выпуска.
# - «Сброс кэша» — окружение site, без checkout: vercel cache invalidate --tag catalog,set-{набор}…;
#   посетители получают прежнюю страницу, пока новая собирается (stale-while-revalidate).
# - «Свежесть» — без ключей: ждёт до 5 минут свежих страниц сброшенных наборов, затем pnpm site --live.
#   Не дождалась — запуск красный; повторить — ручной запуск с «только сброс».
# - Набор без страницы — новый: задача «Пересборка» без кода зависимостей запускает обычную выкладку этого
#   workflow (workflow_dispatch), и та встаёт в общую очередь выкладок.

on:
  workflow_run:
    workflows: ["Поисковый индекс"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/icon/README.md"
      - "packages/icon/CHANGELOG.md"
      - "apps/api/README.md"
      - "packages/core/**"
      - "packages/react/**"
      - "packages/search/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  # Проверка самого workflow на PR — только показ: секретов и права выкладывать там нет.
  pull_request:
    paths:
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать — ничего не выкладывать и не сбрасывать
        type: boolean
        default: false
      refresh:
        description: Без сборки — сверить страницы наборов с раздачей и сбросить кэш устаревших
        type: boolean
        default: false
      refresh_all:
        description: Без сборки — сбросить кэш страниц всех наборов (проба сброса, ADR-0039)
        type: boolean
        default: false

permissions: {}

# Выкладки из main не пересекаются и не прерываются: следующая ждёт текущую. Сбросы по наборам — в своей
# очереди site-refresh: в общей новый сброс отменил бы ждущую выкладку кода (у очереди одно место для
# ждущего), а сброс во время выкладки безвреден — новая выкладка и так начинает с пустого кэша. Показы с
# веток и PR — в своих группах. Запуск после «Поискового индекса», который задача «Сверка с раздачей»
# пропустит (условие у неё), — тоже в своей группе.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    && (github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success'
    || github.event.workflow_run.conclusion == 'failure')
    && github.event.workflow_run.head_repository.full_name == github.repository
    && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    || github.event.workflow_run.event == 'workflow_run')
    && github.event.workflow_run.head_branch == 'main'))
    && ((github.event_name == 'workflow_run' || inputs.refresh || inputs.refresh_all) && 'site-refresh' || 'site')
    || format('site-{0}', github.event_name == 'workflow_run' && github.run_id || github.ref) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Vercel CLI — точная версия, одна и для сборки, и для выкладки.
  VERCEL_CLI: vercel@65.7.0
  VERCEL_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  refresh:
    name: Сверка с раздачей
    # После «Поискового индекса» — только если он шёл в этом репозитории на main — от push, ручного запуска
    # или после «Выкладки» (workflow_run) — и закончился, а не был пропущен или отменён: workflow с тем же
    # именем из PR форка тоже вызывает workflow_run, а его запуск — событие pull_request и чужой репозиторий.
    # Неудачный индекс сайт не держит: страницы наборов всё равно сверяются с раздачей. Задача только
    # читает открытые адреса, а сбрасывает и пересобирает — по её итогу — «Сброс кэша» и «Пересборка».
    # Вручную — «только сброс» или «сбросить все наборы», только из main.
    if: >-
      (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success'
      || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
      || github.event.workflow_run.event == 'workflow_run')
      && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && (inputs.refresh || inputs.refresh_all))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.compare.outputs.stale }}
      missing: ${{ steps.compare.outputs.missing }}
      groups: ${{ steps.compare.outputs.groups }}
      all: ${{ steps.compare.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Edge API помнит версию индекса до 60 секунд в памяти и ещё 30 — в кэше дата-центра (ADR-0024):
      # страницы, собранные раньше, взяли бы прежние описания и похожие.
      - name: Пауза после индекса
        if: github.event_name == 'workflow_run'
        run: sleep 120
      - name: Сверить страницы наборов с раздачей
        id: compare
        env:
          ALL: ${{ inputs.refresh_all == true || (github.event_name == 'workflow_run' && github.event.workflow_run.event != 'workflow_run') }}
        run: |
          if [ "$ALL" = true ]; then pnpm site --refresh --all; else pnpm site --refresh; fi
          file=.cache/reports/site/refresh.json
          {
            echo "stale=$(jq -r '.stale | join(",")' "$file")"
            echo "missing=$(jq -r '.missing | join(",")' "$file")"
            echo "groups=$(jq -c '.groups' "$file")"
            echo "all=$ALL"
          } >> "$GITHUB_OUTPUT"
          cat .cache/reports/site/refresh.md >> "$GITHUB_STEP_SUMMARY"

  invalidate:
    name: Сброс кэша
    needs: refresh
    # Набор без страницы — новый: его выложит «Пересборка», а новая выкладка и так начинает с пустого кэша.
    # «Только показ» и выключенная выкладка сайта (SITE_DEPLOY) — без сброса.
    if: >-
      needs.refresh.outputs.stale != '' && needs.refresh.outputs.missing == ''
      && vars.SITE_DEPLOY == 'on' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Окружение site: ключ Vercel — его секрет, задача идёт только из main. Без checkout: код репозитория и
    # зависимостей с ключом не встречается.
    environment: site
    permissions: {}
    outputs:
      since: ${{ steps.invalidate.outputs.since }}
    steps:
      - name: Сбросить метки наборов
        id: invalidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          GROUPS: ${{ needs.refresh.outputs.groups }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::Нет секрета VERCEL_TOKEN или переменной VERCEL_SCOPE окружения site (ADR-0050)"
            exit 1
          fi
          # Метки — только catalog и set-{набор} по правилу имён (ADR-0001): из выхода другой задачи в
          # команду с ключом не попадёт ничего лишнего.
          tag='(catalog|set-[a-z0-9]+(-[a-z0-9]+)*)'
          rule="^${tag}(,${tag})*\$"
          groups=$(jq -r '.[]' <<< "$GROUPS")
          if [ -z "$groups" ]; then
            echo "::error::нет меток для сброса"
            exit 1
          fi
          while IFS= read -r group; do
            if ! [[ "$group" =~ $rule ]]; then
              echo "::error::метки не по правилу: $group"
              exit 1
            fi
          done <<< "$groups"
          npm install --global --ignore-scripts --no-audit --no-fund "$VERCEL_CLI"
          # Сброс работает в папке, привязанной к проекту: своя пустая папка, из репозитория — ничего.
          cd "$(mktemp -d)"
          vercel link --yes --project iconavo-site --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          # Время сброса — до первой команды: «Свежесть» ждёт страницы, собранные не раньше.
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          while IFS= read -r group; do
            vercel cache invalidate --tag "$group" --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            echo "- сброшены метки: $group" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$groups"

  fresh:
    name: Свежесть
    needs: [refresh, invalidate]
    if: ${{ !cancelled() && needs.invalidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Только чтение открытых адресов. После «сбросить все наборы» отпечатки не меняются — тогда
      # свежесть видна по времени сборки страниц (--all).
      - name: Дождаться свежих страниц
        env:
          SINCE: ${{ needs.invalidate.outputs.since }}
          STALE: ${{ needs.refresh.outputs.stale }}
          ALL: ${{ needs.refresh.outputs.all }}
        run: |
          if [ "$ALL" = true ]; then
            pnpm site --refresh --wait=300 --since="$SINCE" --sets="$STALE" --all
          else
            pnpm site --refresh --wait=300 --since="$SINCE" --sets="$STALE"
          fi
      - name: Проверить iconavo.dev
        run: pnpm site --live
      - name: Сводка
        if: success() || failure()
        run: |
          for file in .cache/reports/site/refresh.md .cache/reports/site/live.md; do
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done

  rebuild:
    name: Пересборка
    needs: refresh
    # Новый набор: страницы наборов собираются при сборке. Обычная выкладка этого workflow встаёт в общую
    # очередь выкладок и собирает свежий main. Право — только запустить workflow, без checkout и кода.
    if: needs.refresh.outputs.missing != '' && vars.SITE_DEPLOY == 'on' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Запустить выкладку сайта
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ needs.refresh.outputs.missing }}
        run: |
          gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "- новые наборы без страниц: $MISSING — запущена выкладка сайта" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Сборка
    # Выкладка кода: push, ручной запуск без «только сброс» и PR (только показ). После «Поискового индекса»
    # сайт не собирается — его страницы сбрасывает путь выше.
    if: >-
      github.event_name != 'workflow_run'
      && !(github.event_name == 'workflow_dispatch' && (inputs.refresh || inputs.refresh_all))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      live: ${{ steps.live.outputs.live }}
      build: ${{ steps.label.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # «Живой» запуск: main, не «только показ», main за это время не ушёл вперёд — иначе запоздавший
      # запуск выложил бы старую сборку поверх новой, — и выкладка включена владельцем.
      - name: Живой запуск?
        id: live
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          SITE_DEPLOY: ${{ vars.SITE_DEPLOY }}
        run: |
          live=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$EVENT" != pull_request ] && [ "$DRY_RUN" != true ]; then
            git fetch --quiet --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
            if ! git diff --quiet origin/main HEAD -- apps/site/ packages/icon/README.md packages/icon/CHANGELOG.md apps/api/README.md packages/core/ packages/react/ packages/search/ pnpm-lock.yaml .github/workflows/site.yml; then
              echo "::warning::main ушёл вперёд — этот запуск только показывает; выкладывает запуск от свежего main."
            elif [ "$SITE_DEPLOY" != on ]; then
              echo "::notice::Выкладка выключена: переменная репозитория SITE_DEPLOY не on — разовая настройка в ADR-0050."
            else
              live=true
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
      # Метка сборки — 8 знаков коммита: её отдаёт заголовок X-Iconavo-Build, по ней «Проверка» узнаёт,
      # что отвечает именно эта сборка.
      - name: Метка сборки
        id: label
        run: echo "build=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - name: Собрать сайт (vercel build)
        env:
          SITE_BUILD: ${{ steps.label.outputs.build }}
        run: |
          # Хосты иконок — только по умолчанию: свои из окружения попали бы в CSP и в страницы сайта.
          if [ -n "${NEXT_PUBLIC_ICONAVO_API:-}${NEXT_PUBLIC_ICONAVO_CDN:-}" ]; then
            echo "::error::NEXT_PUBLIC_ICONAVO_API и NEXT_PUBLIC_ICONAVO_CDN задаёт только проверка pnpm site --check"
            exit 1
          fi
          cd apps/site
          mkdir -p .vercel
          # Настройки проекта — здесь, а не из Vercel: сборке не нужны ни ключ, ни настоящие ID проекта.
          # Установки нет — зависимости уже поставил pnpm 12 этой машины.
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_build_only","orgId":"team_build_only","settings":{"framework":"nextjs","installCommand":"","buildCommand":"next build","devCommand":null,"outputDirectory":null,"rootDirectory":null,"nodeVersion":"24.x"}}
          JSON
          # --standalone: зависимости функций — внутри сборки. Без него сборка ссылается на файлы
          # node_modules репозитория (filePathMap), а «Выкладка» идёт без репозитория — Vercel CLI там
          # останавливается: «Please ensure project dependencies have been installed».
          npx --yes "$VERCEL_CLI" build --prod --yes --standalone
          if grep -rlq '"filePathMap"' --include=.vc-config.json .vercel/output/functions; then
            echo "::error::сборка ссылается на файлы вне .vercel/output — нужен vercel build --standalone"
            exit 1
          fi
          # Заголовки сайта — в сборке: noindex и политика со стилями только файлами.
          jq -e '[.routes[] | select(.headers["X-Robots-Tag"] == "noindex, nofollow" and ((.headers["Content-Security-Policy"] // "") | contains("style-src '"'"'self'"'"';")))] | length > 0' .vercel/output/config.json > /dev/null || {
            echo "::error::в сборке нет заголовков X-Robots-Tag и Content-Security-Policy сайта"
            exit 1
          }
          tar -czf "$RUNNER_TEMP/site-output.tgz" -C .vercel output
          {
            echo "### Сборка сайта"
            echo "- метка: $SITE_BUILD"
            echo "- архив: $(du -h "$RUNNER_TEMP/site-output.tgz" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Готовая сборка — для задачи «Выкладка»: она ничего не собирает сама.
      - uses: actions/upload-artifact@v7
        with:
          name: site-output
          path: ${{ runner.temp }}/site-output.tgz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Выкладка
    needs: build
    if: needs.build.outputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Окружение site: выкладывать из него можно только из main; ключ Vercel — его секрет.
    environment: site
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-output
          path: ${{ runner.temp }}/artifact
      - name: Выложить на Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_SCOPE" ]; then
            echo "::error::Нет секрета VERCEL_TOKEN или переменной VERCEL_SCOPE окружения site (ADR-0050)"
            exit 1
          fi
          # CLI — свежий из реестра, точной версии: из артефакта задача ничего не запускает, только
          # распаковывает файлы в новую папку.
          npm install --global --ignore-scripts --no-audit --no-fund "$VERCEL_CLI"
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/.vercel"
          tar -xzf "$RUNNER_TEMP/artifact/site-output.tgz" -C "$site/.vercel" --no-same-owner
          cd "$site"
          vercel deploy --prebuilt --prod --yes --project iconavo-site --create-if-missing \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tee "$RUNNER_TEMP/deploy.txt"
          echo "- выложена сборка $BUILD: $(tail -n 1 "$RUNNER_TEMP/deploy.txt")" >> "$GITHUB_STEP_SUMMARY"

  check:
    name: Проверка
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.outputs.live == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Только чтение открытых адресов, ключи не нужны. Ждёт до 3 минут, пока ответит новая сборка; версии
      # наборов на их страницах — как в живом манифесте раздачи («Свежесть данных»).
      - name: Проверить iconavo.dev
        env:
          BUILD: ${{ needs.build.outputs.build }}
        run: pnpm site --live --expect-build="$BUILD"
      - name: Сводка
        if: success() || failure()
        run: |
          file=.cache/reports/site/live.md
          if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
