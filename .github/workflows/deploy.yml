name: Выкладка

# Выкладка раздачи на два хоста (ADR-0022, ADR-0025; шаги 2 и 4 фазы 2): после слияния в main PR с
# данными — pnpm cdn upload, то есть сборка dist-cdn/ из data/ и выгрузка в бакет R2 iconavo-cdn
# (cdn.iconavo.dev), затем в хранилище Bunny iconavo-cdn (cdn2.iconavo.dev). Выгружаются только
# недостающие файлы версий: версии неизменяемы, в v/ ничего не перезаписывается; в наборе файл сумм
# уходит последним, затем сверка контрольных сумм по списку хранилища. Манифесты — в самом конце,
# когда файлы версий есть на обоих хостах, второй хост — последним, и только при отличии; «СТОП» на
# одном хосте — манифесты не пишутся нигде. Ничего не удаляется. Ключи — секреты R2_ACCOUNT_ID,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (токен «Object Read & Write» только на бакет) и
# BUNNY_STORAGE_PASSWORD (пароль хранилища Bunny). На PR не запускается: секретов там нет, а без
# ключей не прочитать даже списки хранилищ. Откат — откат PR с данными: манифесты вернутся к прежней
# версии, её файлы на месте. После выгрузки — pnpm cdn check (ADR-0023, ADR-0025): заголовки живых
# адресов обоих хостов и одинаковые манифесты; сломались правила CDN — «Выкладка» красная. Там же —
# edge API (ADR-0024): функция перечитывает манифест раз в минуту, проверка ждёт новую версию до 3
# минут и сверяет ответы API со статикой.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "packages/pipeline/src/cdn/**"
      - "packages/pipeline/src/cli.ts"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать, что будет выгружено
        type: boolean
        default: false

permissions:
  contents: read

# Выгрузки не пересекаются и не прерываются: следующая ждёт текущую.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  upload:
    name: R2 и Bunny
    runs-on: ubuntu-latest
    # С запасом на первую полную выгрузку на новый хост; повтор докачивает только недостающее.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Вручную с другой ветки — только если data/ та же, что в main: иначе выкладка вернула бы
      # хостам прежний манифест. Показ ничего не пишет — ему можно и так.
      - name: data/ та же, что в main
        if: github.ref != 'refs/heads/main' && inputs.dry_run != true
        run: |
          git fetch --quiet --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git diff --quiet origin/main HEAD -- data/; then
            echo "::error::data/ на этой ветке не та, что в main: выкладка с неё вернула бы хостам прежний манифест. Догоните ветку до main или запустите с флажком «только показ»."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Собрать и выгрузить
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            pnpm cdn upload --dry-run
          else
            pnpm cdn upload
          fi
      # Только чтение открытых адресов, ключи не нужны; и в режиме «только показ».
      - name: Проверить заголовки
        run: pnpm cdn check
      # Страница без архива открывается в браузере. Копия — вне .cache: скрытые папки upload-artifact пропускает.
      - name: Отчёт — вне .cache
        id: pages
        if: always()
        run: |
          pages="$RUNNER_TEMP/pages"
          mkdir -p "$pages"
          cp .cache/reports/cdn/upload.html "$pages/upload.html" 2> /dev/null || true
          cp .cache/reports/cdn/index.html "$pages/build.html" 2> /dev/null || true
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
      - name: Отчёт — выгрузка
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upload.html
          path: ${{ steps.pages.outputs.pages }}/upload.html
          archive: false
          if-no-files-found: ignore
      - name: Отчёт — сборка раздачи
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build.html
          path: ${{ steps.pages.outputs.pages }}/build.html
          archive: false
          if-no-files-found: ignore
